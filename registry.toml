version = 1

# grill-me is Matt Pocock's skill, pinned to a commit. It is imported
# instead of copied, so it can be updated by moving the ref. It hands over
# to his "grilling" skill, so both are needed.
[[import]]
url = "https://github.com/mattpocock/skills.git"
ref = "abeeaf95660ba9e8b7c753eb38f441ca707a8823"
skills = ["grill-me", "grilling"]

# security-audit is Cloudflare's skill, pinned to a commit.
[[import]]
url = "https://github.com/cloudflare/security-audit-skill.git"
ref = "c1c8a8c1471069fb0e188eeaff69b8e8db6564a8"
skills = ["security-audit"]

# agent-browser is Vercel's skill for its browser automation CLI, pinned to
# a commit. It needs the CLI: npm i -g agent-browser && agent-browser install
[[import]]
url = "https://github.com/vercel-labs/agent-browser.git"
ref = "1fde6b90e8f17474b2f122d4b4ce43a7fa0a6aa0"
skills = ["agent-browser"]

# hallmark is Together AI's design skill for new pages, pinned to a commit.
# It needs Node 18; the browser checks also need puppeteer-core and Chrome.
[[import]]
url = "https://github.com/Nutlope/hallmark.git"
